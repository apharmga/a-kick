<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게스트 매칭 · A-KICK</title>
<meta name="description" content="인원이 모자란 축구·풋살 모임과 공 찰 곳을 찾는 사람을 이어주는 A-KICK 게스트 매칭">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1E3A8A">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#1E3A8A;--navy-l:#E8EDFB;--bg:#F3F5F9;--ink:#0F172A;--ink2:#334155;--sub:#64748B;--line:#E5E9F0;--pos:#15803D;--posbg:#E7F5EC;--neg:#B91C1C;--negbg:#FDECEC;--warn:#B45309;--warnbg:#FFF7E6}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:14px;line-height:1.45;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;letter-spacing:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;padding-bottom:40px}
.center{padding:80px 20px;text-align:center;color:var(--sub)}
.demob{background:#FFF4CC;color:#7A5200;font-size:13px;padding:8px 16px;display:flex;justify-content:space-between}
.hd{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.hd b{font-size:18px}
.hd .bk{font-size:24px;color:var(--sub);text-decoration:none;line-height:1;padding:0 4px}
.rg{margin-left:auto;font-size:13px;color:var(--navy);font-weight:700}
.rg select{border:0;background:transparent;color:var(--navy);font-weight:800;font-size:14px}
.seg{display:flex;background:#fff;border-radius:12px;padding:4px;margin:12px 16px 0;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;padding:9px 0;border-radius:9px;font-weight:700;font-size:13px;color:var(--sub);min-height:40px}
.seg .on{background:var(--navy);color:#fff}
.flt{display:flex;gap:6px;padding:10px 16px 0;overflow-x:auto;scrollbar-width:none}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink2);background:#fff;white-space:nowrap;min-height:36px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.bd{padding:12px 16px}
.gc{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(15,23,42,.06);color:inherit}
.gc:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:3px solid #93A9E8;outline-offset:2px}
.t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.when{font-size:17px;font-weight:900}
.where{font-size:13px;color:var(--ink2);margin-top:3px}
.d{font-size:12px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
.d.b{background:var(--navy-l);color:var(--navy)}
.meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;border-radius:6px;padding:4px 8px;background:var(--bg);color:var(--ink2)}
.pill.need{background:var(--negbg);color:var(--neg)}
.pill.fee{background:var(--posbg);color:var(--pos)}
.pill.me{background:var(--navy-l);color:var(--navy)}
.fac{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px;color:var(--ink2)}
.bar2{height:6px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--navy)}
.club{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.av{width:24px;height:24px;border-radius:7px;background:var(--navy);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.empty,.soon{background:#fff;border-radius:14px;padding:28px 18px;text-align:center;color:var(--sub);margin:12px 16px}
.empty b,.soon b{color:var(--ink);display:block;margin-bottom:6px;font-size:15px}
.empty p,.soon p{margin:0}
.login,.mine{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 16px 0;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.login b{font-size:15px}.login p{margin:4px 0 10px;color:var(--sub);font-size:13px}
.lbl{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:6px}
.mrow{padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.mrow:first-of-type{border-top:0}
.mt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.ok{background:var(--posbg);color:var(--pos)}.st.wait{background:var(--warnbg);color:var(--warn)}.st.bad{background:var(--negbg);color:var(--neg)}
.pay{margin-top:8px;background:var(--warnbg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.pay span{color:var(--ink2);font-size:12px}
.pay.soft{background:var(--bg);color:var(--ink2)}
.pay.conf{background:var(--navy-l)}
.row{display:flex;gap:6px}
.sbtn{font-size:13px;font-weight:800;border-radius:9px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--ink2);min-height:40px}
.sbtn.ok{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px;background:var(--navy);color:#fff;min-height:48px}
.btn.sec{background:#fff;color:var(--ink2);border:1px solid var(--line);margin-top:10px}
.mystat{text-align:center;color:var(--sub);font-size:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#0F172A;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:50;max-width:92vw}
#sheet{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 18px}
.phero{background:var(--navy);color:#fff;padding:20px 18px}
.phero .when{font-size:22px}.phero .where{color:rgba(255,255,255,.85)}
.phero .pill{background:rgba(255,255,255,.15);color:#fff}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin:10px 14px 0;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.card.okc{border:2px solid #9FD3B2}.card.warnc{background:var(--warnbg);color:var(--warn);font-weight:700}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.kv:first-of-type{border-top:0}.kv span{color:var(--sub)}.kv b{text-align:right}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.trust div{background:var(--bg);border-radius:10px;padding:8px 0;text-align:center}
.trust b{display:block;font-size:17px}.trust span{font-size:11px;color:var(--sub)}
.note{font-size:12.5px;color:var(--ink2);margin:8px 0 0;line-height:1.5}.note.warn{color:var(--warn);font-weight:700}
.f{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-top:10px}
.f input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;color:var(--ink);background:#fff}
.card .btn{margin-top:12px}
.rep{text-align:center;margin:14px 0 0;font-size:12px;color:var(--sub)}
.lnk{border:0;background:transparent;color:var(--sub);font-size:12px;text-decoration:underline;padding:6px}
.sbox>.btn.sec{width:auto;margin:12px 14px 0}
.abtn,.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:13px;font-weight:800;margin-top:8px;border:1px solid var(--line);background:#fff}
.abtn{background:#000;color:#fff;border-color:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"><div class="center">불러오는 중...</div></div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<script src="core.js"></script>
<script type="module" src="match.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
